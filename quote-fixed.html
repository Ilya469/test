<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XXX AI 智能报价平台</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.frame{width:100%;height:100%;border:0;display:block}.back{position:fixed;z-index:20;right:20px;top:18px;border:1px solid rgba(0,0,0,.1);border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 8px 28px rgba(0,0,0,.13);padding:10px 15px;font-size:13px;color:#222;cursor:pointer;backdrop-filter:blur(10px)}.back:hover{background:#fff}@media(max-width:680px){.back{right:10px;top:10px;padding:9px 12px;font-size:12px}}
</style>
</head>
<body>
<button class="back" type="button" onclick="location.href='./'">返回作品集</button>
<iframe id="quoteFrame" class="frame" src="projects/quote/index.html" title="AI 智能报价平台"></iframe>
<script>
const frame=document.getElementById('quoteFrame');
function applyFix(){
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    const brandLogo=doc.querySelector('button.brand img, .brand img');
    if(!brandLogo||!brandLogo.src)return;
    const hero=Array.from(doc.querySelectorAll('img')).find(img=>{
      const box=img.getBoundingClientRect();
      const parent=img.closest('.hero');
      return !!parent || (box.width>100&&box.height>100&&img.naturalWidth===0);
    });
    if(hero&&hero.src!==brandLogo.src){
      hero.src=brandLogo.src;
      hero.alt='XXX 企业 AI 自动报价智能体';
      hero.style.objectFit='contain';
      hero.style.padding='18px';
      hero.style.background='transparent';
    }
  }catch(e){}
}
frame.addEventListener('load',()=>{
  let n=0;
  const timer=setInterval(()=>{applyFix();if(++n>80)clearInterval(timer)},120);
});
</script>
</body>
</html>
